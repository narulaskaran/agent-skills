services:
  nano:
    build: .
    image: nano:local
    container_name: nano
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
      # Credentials. Kept off ./data, which the agent can write.
      - ./vault:/vault
    # Full Chromium needs more than Docker's 64 MB /dev/shm and a little headroom.
    shm_size: 1gb
    mem_limit: 4g
    memswap_limit: 4g
